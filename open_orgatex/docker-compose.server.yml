services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openorgatex_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8743}:8788"
    environment:
      - PORT=8788
      - HOST=0.0.0.0
      - OFFLINE_MODE=${OFFLINE_MODE:-false}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://postgres:sensorSMM!@192.168.100.30:5433/pt_smm_jetflow}
      - WRITE_MODE_ENABLED=${WRITE_MODE_ENABLED:-false}
    volumes:
      # Mount folder data aplikasi (menggunakan path relatif agar kompatibel di Linux & Windows)
      - ./backend:/app/open_orgatex/backend
      - ../OrgaTex_Share:/app/OrgaTex_Share
      - ../Programs:/app/Programs
      - ../STATUS:/app/STATUS
      - ../plain_export:/app/plain_export
      - ..:/app/sc777ce_root
    networks:
      - orgatex_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openorgatex_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4141}:4141"
    depends_on:
      - backend
    networks:
      - orgatex_net

networks:
  orgatex_net:
    driver: bridge
