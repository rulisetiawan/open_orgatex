<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1420" />
    <title>SMM Digital Automation</title>
    <!-- Prevent theme flicker before mount -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('smm_theme') || localStorage.getItem('color-theme');
          if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            var metaDark = document.querySelector('meta[name="theme-color"]');
            if (metaDark) metaDark.setAttribute('content', '#0b1420');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
            var metaLight = document.querySelector('meta[name="theme-color"]');
            if (metaLight) metaLight.setAttribute('content', '#ffffff');
          }
        } catch(e) {}
      })();
    </script>
    <!-- Google Fonts Inter for Clean High-Tech Industrial UI & Tabular Numbers -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-whiten text-body dark:bg-boxdark-2 dark:text-bodydark antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
