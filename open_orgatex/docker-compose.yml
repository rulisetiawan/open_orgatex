services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openorgatex_backend
    restart: unless-stopped
    ports:
      - "8743:8788"
    environment:
      - PORT=8788
      - HOST=0.0.0.0
      - OFFLINE_MODE=false
      - DATABASE_URL=postgresql+psycopg2://postgres:sensorSMM!@192.168.100.30:5433/pt_smm_jetflow
      - WRITE_MODE_ENABLED=false
      - EMQX_HOST=192.168.100.30
      - EMQX_PORT=1883
      - EMQX_USER=admin
      - EMQX_PASS=sensorSMM!
    volumes:
      - ./backend:/app/open_orgatex/backend
      - ../WORKSPACE_PROGRAM_MESIN:/app/WORKSPACE_PROGRAM_MESIN:ro
      - ../OrgaTex_Share:/app/OrgaTex_Share
      - ../Programs:/app/Programs
      - ../STATUS:/app/STATUS
      - ../plain_export:/app/plain_export
      - ..:/app/sc777ce_root
      # - C:/:/host_c  # DINONAKTIFKAN: Hanya valid di Windows lokal, menyebabkan error 'invalid volume specification' di server Linux.
      # - D:/:/host_d
    networks:
      - orgatex_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openorgatex_frontend
    restart: unless-stopped
    ports:
      - "4141:4141"
    depends_on:
      - backend
    networks:
      - orgatex_net

networks:
  orgatex_net:
    driver: bridge
