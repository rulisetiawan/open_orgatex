collector:
  name: "DA-SETEX-GoCollector"
  log_level: "info" # debug, info, warn, error
  multi_machine: true
  max_workers: 12
  # Fokus mesin pilot saat ini: hanya 10B & 1F
  # Kosongkan ([]) jika nanti ingin memantau seluruh mesin aktif di database
  target_machines:
    - "10B"
    - "1F"

database:
  url: "postgresql://postgres:sensorSMM!@192.168.100.30:5433/pt_smm_jetflow"

emqx:
  broker_url: "tcp://192.168.100.30:1883"
  client_id: "da_setex_collector"
  username: "admin"
  password: "sensorSMM!"
  topic_telemetry_prefix: "smm/jetflow"
  topic_status_prefix: "smm/jetflow"

# Pilot testing configuration for MESIN_10B
pilot_machine:
  machine_id: "10B"
  asset_id: "JF-LB-10"
  controller_ip: "172.16.110.160"
  tcp_port: 50000
  ftp_port: 21
  ftp_user: ""
  ftp_password: ""
  config_base_dir: "WORKSPACE_PROGRAM_MESIN" # Otomatis mencari MESIN_10B/02_CONFIG_SIAP_PAKAI
  
  objects:
    enable_iw_1025: true      # Sensor PV (up to 200 words)
    enable_set_1009: true     # Recipe Setpoint SV (40 words)
    enable_act_1010: true     # Loop Actuals PV (20 words)
    enable_batch_1035: true   # Water/Steam Totalizer (10 DWORDs)
    enable_function_6: true   # Active Step Function
    enable_status_act: false  # NONAKTIF: Matikan penarikan file STATUS.ACT via FTP
  
  # Polling Intervals
  telemetry_interval_sec: 5   # 1 koneksi TCP per 5 detik (ramah socket Windows CE)
  status_act_interval_sec: 0 # Dinonaktifkan (0s)
  batch_log_interval_sec: 60
