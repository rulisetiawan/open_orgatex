version: '3.8'

services:
  da-db-writer-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: da-db-writer:1.1.0
    container_name: da_db_writer_1
    restart: always

    # Mode Host Network direkomendasikan pada host Linux
    # agar kontainer dapat langsung mengakses EMQX broker (192.168.100.30:1883)
    # dan database PostgreSQL (192.168.100.30:5433) tanpa latensi NAT docker.
    network_mode: "host"

    environment:
      - TZ=Asia/Jakarta
      - CONFIG_PATH=/app/config.yaml
      - CLIENT_ID=da_db_writer_1

    volumes:
      - ./config.yaml:/app/config.yaml:ro

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 64M

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  da-db-writer-2:
    image: da-db-writer:1.1.0
    container_name: da_db_writer_2
    restart: always
    network_mode: "host"

    environment:
      - TZ=Asia/Jakarta
      - CONFIG_PATH=/app/config.yaml
      - CLIENT_ID=da_db_writer_2

    volumes:
      - ./config.yaml:/app/config.yaml:ro

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 64M

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
